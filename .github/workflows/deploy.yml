# Builds the site and publishes it to GitHub Pages on every push to main — including every save in Pages CMS
# (each save is a commit). A build that fails (e.g. content that breaks site/src/content.config.ts) publishes nothing:
# the live site stays on the previous version. Repo settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer save cancels a build still waiting in line, never one that is deploying
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      BASE_PATH: /marbach/
      SITE_URL: https://yossirb9.github.io
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # build-images (media/ → WebP in public/m, cached in src/data/images.json, both committed) + astro build
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
